name: "Autopilot: Stale Sweep"

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "priority/high,pinned"
          exempt-pr-labels: "pinned"
          stale-issue-message: >
            This issue has had no activity for 30 days and has been marked stale.
            It will be closed in 7 days if no further activity occurs.
          stale-pr-message: >
            This pull request has had no activity for 30 days and has been marked stale.
            It will be closed in 7 days if no further activity occurs.
          close-issue-message: "Closing due to inactivity. Feel free to reopen if this is still relevant."
          close-pr-message: "Closing due to inactivity. Feel free to reopen if you'd like to continue this."
