name: "Autopilot: Weekly Digest"

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Build and post weekly digest issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            await ensureLabel('digest', '0e8a16', 'Weekly automated activity digest');

            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceStr = since.toISOString().slice(0, 10);
            const todayStr = new Date().toISOString().slice(0, 10);

            async function searchAll(q) {
              return github.paginate(github.rest.search.issuesAndPullRequests, {
                q, per_page: 100,
              });
            }

            const mergedPRs = await searchAll(`repo:${owner}/${repo} is:pr is:merged merged:>=${sinceStr}`);
            const openedPRs = await searchAll(`repo:${owner}/${repo} is:pr created:>=${sinceStr}`);
            const openedIssues = await searchAll(`repo:${owner}/${repo} is:issue created:>=${sinceStr}`);
            const closedIssues = await searchAll(`repo:${owner}/${repo} is:issue closed:>=${sinceStr}`);

            const contributors = new Map();
            for (const pr of mergedPRs) {
              const login = pr.user?.login || 'unknown';
              contributors.set(login, (contributors.get(login) || 0) + 1);
            }
            const topContributors = [...contributors.entries()]
              .sort((a, b) => b[1] - a[1])
              .slice(0, 5)
              .map(([login, count]) => `- @${login} — ${count} merged PR${count > 1 ? 's' : ''}`)
              .join('\n') || '_No merged PRs this week._';

            function listSection(items, emptyText) {
              if (!items.length) return emptyText;
              return items.slice(0, 15).map(i => `- [#${i.number}](${i.html_url}) ${i.title}`).join('\n');
            }

            const body = [
              `## 📊 Weekly Digest — ${sinceStr} to ${todayStr}`,
              ``,
              `| Metric | Count |`,
              `| --- | --- |`,
              `| PRs merged | ${mergedPRs.length} |`,
              `| PRs opened | ${openedPRs.length} |`,
              `| Issues opened | ${openedIssues.length} |`,
              `| Issues closed | ${closedIssues.length} |`,
              ``,
              `### Merged PRs`,
              listSection(mergedPRs, '_None._'),
              ``,
              `### New issues`,
              listSection(openedIssues, '_None._'),
              ``,
              `### Top contributors`,
              topContributors,
              ``,
              `<sub>🤖 Auto-generated by the weekly digest workflow.</sub>`,
            ].join('\n');

            await github.rest.issues.create({
              owner, repo,
              title: `Weekly Digest: ${sinceStr} – ${todayStr}`,
              body,
              labels: ['digest'],
            });
